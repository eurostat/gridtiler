name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # every Monday: dependencies are not pinned
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["22", "24", "26"]
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install the package
        run: npm install --omit=dev --no-package-lock
      - name: Run the tests
        run: npm test

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Resolve the dependencies
        run: npm install --package-lock-only
      - name: Check the dependencies installed by users for known vulnerabilities
        run: npm audit --omit=dev
